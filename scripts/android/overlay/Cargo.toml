[package]
name = "omniget"
version = "0.16.6"
description = "OmniGet Android runtime (desktop engine stripped)"
authors = ["sumarkcat"]
edition = "2021"

[lib]
name = "omniget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.dev]
debug = 0
codegen-units = 256

[profile.release]
strip = true
